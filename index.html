<style>

<script>
const JAB=['Teknisi','Helper','Magang/PSG','Supervisor','Admin','HR'],AREAS=['Makassar','Gowa','BTP','SPK','Kantoran'];
const JENIS=['Izin','Sakit','Cuti','Libur','Telat Izin','Cepat Pulang','Tanpa Keterangan'],ABS=['Izin','Sakit','Cuti','Libur','Tanpa Keterangan'];
const COL=['#1e3a8a','#2563eb','#38bdf8','#7dd3fc','#6366f1','#0d9488','#f59e0b','#94a3b8'];
const KEY='mmt_ops_v1';
let D={karyawan:[],izin:[],evaluasi:[],monitor:[],hrop:[],hrd:[],sop:[],pkl:[],tim:{},set:{nama:'Mitra Multi Teknik',hr:'',wa:'',logo:''}};
try{const s=localStorage.getItem(KEY);if(s)D=Object.assign(D,JSON.parse(s))}catch(e){}
let V='dash',IF='Semua',Q='',DF='',TD='',PIE={},CB=null,TH=''; try{TH=localStorage.getItem('mmt_theme')||''}catch(e){}
const $=s=>document.querySelector(s),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toLocaleDateString('sv'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
TD=today();DF=today();
const loc=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('Penyimpanan penuh. Hapus foto lama atau ekspor data.')}};
let FB=null,FC={},FREADY=false,FS='Tidak terhubung',FBC=null,DR=null;const DEFAULT_FB={apiKey:"AIzaSyCqkDognQU7YyzS-11AymnPQXeHk7RqZqU",authDomain:"laporan-monitoring-tim-op.firebaseapp.com",projectId:"laporan-monitoring-tim-op",storageBucket:"laporan-monitoring-tim-op.firebasestorage.app",messagingSenderId:"1054047923272",appId:"1:1054047923272:web:c873a747609b5d12c13c7d",measurementId:"G-M78LVKEJM9"};
try{const st=localStorage.getItem('mmt_fb');FBC=st==='off'?null:st?JSON.parse(st):DEFAULT_FB}catch(e){FBC=DEFAULT_FB}
const COLS=['karyawan','pkl','izin','evaluasi','monitor','hrop','hrd','sop'];
const sv=()=>{loc();if(FREADY)fbPush()};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2800)}
function theme(t){if(t)document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme');}
function togTheme(){const dark=document.documentElement.getAttribute('data-theme')?document.documentElement.getAttribute('data-theme')=='dark':matchMedia('(prefers-color-scheme:dark)').matches;TH=dark?'light':'dark';theme(TH);try{localStorage.setItem('mmt_theme',TH)}catch(e){}}
theme(TH);
const jabOf=n=>{const x=String(n||'').trim().toLowerCase();return(D.karyawan.find(k=>k.nama.toLowerCase()==x)||{}).jabatan||(D.pkl.some(k=>k.nama.toLowerCase()==x)?'PKL Sekolah':'')};
const ov=(e,a,b)=>e.tgl<=b&&(e.sampai||e.tgl)>=a;
const fd=d=>d?d.split('-').reverse().join('/'):'';
function weekR(){const d=new Date(),w=(d.getDay()+6)%7,a=new Date(d);a.setDate(d.getDate()-w);const b=new Date(a);b.setDate(a.getDate()+6);return[a.toLocaleDateString('sv'),b.toLocaleDateString('sv')]}
/* ---------- Excel ---------- */
async function xlb(sh,fn){const wb=XLSX.utils.book_new();for(const n in sh)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(sh[n].length?sh[n]:[{Info:'Belum ada data'}]),n.slice(0,31));
 const buf=XLSX.write(wb,{type:'array',bookType:'xlsx'});let dl=null;try{dl=window.claude?await window.claude.use('downloads'):null}catch(e){}
 if(dl){try{await dl.save({filename:fn+'.xlsx',data:new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})})}catch(e){if(!e||e.code!='declined')toast('Gagal menyimpan file')}}else XLSX.writeFile(wb,fn+'.xlsx')}
/* ---------- Charts ---------- */
function pie(items,fn){items=items.filter(i=>i.v>0);const tot=items.reduce((a,b)=>a+b.v,0);if(!tot)return'<div class="empty">Belum ada data</div>';
 PIE[fn]=items;let a=-Math.PI/2,s='<svg viewBox="-1 -1 2 2" role="img" aria-label="Diagram lingkaran">';
 items.forEach((it,i)=>{const c=COL[i%COL.length];if(items.length==1)s+=`<circle r="1" fill="${c}" style="cursor:pointer" onclick="${fn}(${i})"/>`;else{const b=a+it.v/tot*2*Math.PI,x1=Math.cos(a),y1=Math.sin(a),x2=Math.cos(b),y2=Math.sin(b);s+=`<path d="M0 0L${x1} ${y1}A1 1 0 ${b-a>Math.PI?1:0} 1 ${x2} ${y2}Z" fill="${c}" stroke="var(--card)" stroke-width=".02" style="cursor:pointer" onclick="${fn}(${i})"><title>${esc(it.l)}: ${it.v}</title></path>`;a=b}});
 s+=`<circle r=".52" fill="var(--card)"/><text y=".08" text-anchor="middle" font-size=".36" font-weight="800" fill="var(--ink)">${tot}</text></svg>`;
 return`<div class="pw">${s}<div class="lg">${items.map((it,i)=>`<span onclick="${fn}(${i})"><i style="background:${COL[i%COL.length]}"></i>${esc(it.l)}: <b>${it.v}</b></span>`).join('')}</div></div>`}
function bars(items,fn){const tot=items.reduce((a,b)=>a+b.v,0),m=Math.max(1,...items.map(i=>i.v));if(!tot)return'<div class="empty">Belum ada data karyawan</div>';
 return`<div class="bars">${items.map((it,i)=>`<div class="br" role="button" tabindex="0" onclick="${fn}('${it.l}')" onkeydown="if(event.key=='Enter')${fn}('${it.l}')"><div class="l"><span>${esc(it.l)}</span><span><b>${it.v}</b> <small style="color:var(--mut)">(${Math.round(it.v/tot*100)}%)</small></span></div><div class="t"><div class="f" style="width:${it.v/m*100}%;background:${COL[i%COL.length]}"></div></div></div>`).join('')}</div>`}
function line(pts){const W=620,H=190,p=30,m=Math.max(1,...pts.map(x=>x.v)),X=i=>p+i*(W-2*p)/(pts.length-1),Y=v=>H-24-(v/m)*(H-52);
 let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Grafik jumlah tim jalan">`;
 for(let i=0;i<=m&&m<=8;i++)s+=`<line x1="${p}" x2="${W-p}" y1="${Y(i)}" y2="${Y(i)}" stroke="var(--line)"/><text x="${p-8}" y="${Y(i)+4}" text-anchor="end" font-size="10" fill="var(--mut)">${i}</text>`;
 s+=`<polyline fill="none" stroke="var(--pri)" stroke-width="2.5" points="${pts.map((x,i)=>X(i)+','+Y(x.v)).join(' ')}"/>`;
 pts.forEach((x,i)=>{s+=`<circle cx="${X(i)}" cy="${Y(x.v)}" r="4" fill="var(--pri)"><title>${x.l}: ${x.v} tim</title></circle><text x="${X(i)}" y="${Y(x.v)-9}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--ink)">${x.v}</text>`;if(i%2==0||pts.length<8)s+=`<text x="${X(i)}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--mut)">${x.l}</text>`});return s+'</svg>'}
/* ---------- Modal ---------- */
function modal(h){$('#mo').innerHTML=`<div class="mo" onclick="if(event.target==this)cm()"><div class="md" role="dialog">${h}</div></div>`}
function cm(){$('#mo').innerHTML=''}
function zoom(s){modal(`<img src="${s}" style="width:100%;border-radius:10px"><p style="text-align:right"><button class="sec" onclick="cm()">Tutup</button></p>`)}
function cf(msg,fn){CB=fn;modal(`<h2>Konfirmasi</h2><p>${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button class="sec" onclick="cm()">Batal</button><button onclick="cm();CB()">Hapus</button></div>`)}
function listM(title,rows){modal(`<h2>${esc(title)}</h2>${rows.length?`<div class="tw"><table style="min-width:0"><tr><th>Nama</th><th>Jabatan</th><th>Keterangan</th></tr>${rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}</table></div>`:'<div class="empty">Belum ada data</div>'}<p style="text-align:right"><button class="sec" onclick="cm()">Tutup</button></p>`)}
const stNow=n=>{const e=D.izin.find(x=>x.nama.toLowerCase()==n.toLowerCase()&&ov(x,today(),today()));return e?e.jenis+(e.alasan?' - '+e.alasan:''):'Hadir / tidak ada izin'};
function kl(j){if(j=='PKL Sekolah'){listM('Daftar PKL Sekolah ('+D.pkl.length+')',D.pkl.map(k=>[k.nama,'PKL Sekolah',[k.sekolah,k.kelas?'Kelas '+k.kelas:'',k.jurusan,k.masuk?'Masuk '+fd(k.masuk):'',k.tarik?'Penarikan '+fd(k.tarik):''].filter(Boolean).join(' | ')]));return}listM('Daftar '+j+' ('+D.karyawan.filter(k=>k.jabatan==j).length+')',D.karyawan.filter(k=>k.jabatan==j).map(k=>[k.nama,k.jabatan,[k.ket,'Hari ini: '+stNow(k.nama)].filter(Boolean).join(' | ')]))}
const izT=()=>D.izin.filter(e=>ov(e,today(),today()));
function il(j){const r=izT().filter(e=>j=='Semua'||e.jenis==j);listM('Izin hari ini: '+j+' ('+r.length+')',r.map(e=>[e.nama,jabOf(e.nama),e.jenis+(e.alasan?' - '+e.alasan:'')]))}
const ilp=i=>il(PIE.ilp[i].l);
function kmp(i){kl(PIE.kmp[i].l)}
/* ---------- Form ---------- */
function jb(el){const s=el.parentNode.querySelector('small.jb');if(s)s.textContent=jabOf(el.value)?'Jabatan: '+jabOf(el.value):''}
function frm(title,fs,init,ok){const b=fs.map(f=>{let v=init[f.k]??(f.d=='@today'?today():f.d)??'',i;
 if(f.t=='select')i=`<select id="f_${f.k}">${f.o.map(o=>`<option ${o==v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
 else if(f.t=='textarea')i=`<textarea id="f_${f.k}" rows="3">${esc(v)}</textarea>`;
 else if(f.t=='file')i=`<input id="f_${f.k}" type="file" accept="image/*">${v?'<small>Sudah ada gambar. Pilih file baru untuk mengganti.</small>':''}`;
 else if(f.t=='name')i=`<input id="f_${f.k}" list="dl" autocomplete="off" value="${esc(v)}" oninput="jb(this)"><small class="jb">${jabOf(v)?'Jabatan: '+esc(jabOf(v)):''}</small>`;
 else i=`<input id="f_${f.k}" type="${f.t}" value="${esc(v)}">`;return`<label for="f_${f.k}">${f.l}</label>${i}`}).join('');
 modal(`<h2>${esc(title)}</h2>${b}<div class="row" style="justify-content:flex-end;margin-top:16px"><button class="sec" onclick="cm()">Batal</button><button id="sb">Simpan</button></div>`);
 $('#sb').onclick=async()=>{const o={};for(const f of fs){const el=$('#f_'+f.k);if(f.t=='file')o[f.k]=el.files[0]?await img(el.files[0],f.px||700):(init[f.k]||'');else o[f.k]=el.value.trim()}
  const rq=fs.find(f=>['name','text','textarea'].includes(f.t));if(rq&&rq.req!==0&&!o[rq.k]){toast('Lengkapi data yang wajib diisi');return}ok(o);cm()}}
function img(file,mx){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,mx/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.65))};i.onerror=()=>res('');i.src=r.result};r.readAsDataURL(file)})}
/* ---------- Konfigurasi modul ---------- */
const N={k:'nama',l:'Nama',t:'name'},T={k:'tgl',l:'Tanggal',t:'date',d:'@today'};
const foto=e=>e.foto?`<img class="th" src="${e.foto}" alt="Foto bukti" onclick="zoom(this.src)">`:'-';
const CFG={

function ld(u){return new Promise((r,j)=>{const x=document.createElement('script');x.src=u;x.onload=r;x.onerror=j;document.head.appendChild(x)})}
function fbSave(){let t=$('#s_fb').value.trim(),o;try{o=JSON.parse(t)}catch(e){try{t=t.slice(t.indexOf('{'),t.lastIndexOf('}')+1).replace(/'/g,'"').replace(/([{,]\s*)(\w+)\s*:/g,'$1"$2":').replace(/,\s*}/g,'}');o=JSON.parse(t)}catch(x){toast('Format firebaseConfig tidak valid');return}}
 if(!o.projectId||!o.apiKey){toast('apiKey dan projectId wajib ada');return}localStorage.setItem('mmt_fb',JSON.stringify(o));location.reload()}
function fbOff(){localStorage.setItem('mmt_fb','off');location.reload()}
function fbErr(e){FS='Gagal: '+(e&&e.message||e);const el=$('#fbst');if(el)el.textContent='Status: '+FS;toast('Firebase: '+(e&&e.code||'error'))}

async function fbInit(){if(!FBC)return;try{const b='https://www.gstatic.com/firebasejs/10.12.2/';await ld(b+'firebase-app-compat.js');await ld(b+'firebase-firestore-compat.js');firebase.initializeApp(FBC);FB=firebase.firestore();FS='Menghubungkan...';
 let pend=COLS.length+2;const first=()=>{if(--pend==0){FREADY=true;FS='Terhubung ke '+FBC.projectId;const el=$('#fbst');if(el)el.textContent='Status: '+FS}};
 COLS.forEach(k=>{let f=true;FB.collection(k).onSnapshot(s=>{const arr=s.docs.map(d=>d.data()).sort((a,b)=>(a.ord||0)-(b.ord||0));
  if(f){f=false;first();if(!arr.length&&D[k].length){fbPush(k);return}}
  if(JSON.stringify(arr)==JSON.stringify(D[k]))return;D[k]=arr;arr.forEach(e=>FC[k+'|'+e.id]=JSON.stringify(e));Object.keys(FC).filter(x=>x.startsWith(k+'|')&&!arr.some(e=>x==k+'|'+e.id)).forEach(x=>delete FC[x]);loc();rr()},fbErr)});
 let ft=true;FB.collection('tim').onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data().list||[]);if(ft){ft=false;first();if(!s.size&&Object.keys(D.tim).length){fbPush('tim');return}}
  if(JSON.stringify(o)==JSON.stringify(D.tim))return;D.tim=o;Object.keys(FC).filter(x=>x.startsWith('tim|')).forEach(x=>delete FC[x]);Object.keys(o).forEach(d=>FC['tim|'+d]=JSON.stringify(o[d]));loc();rr()},fbErr);
 let fs=true;FB.doc('set/main').onSnapshot(d=>{if(fs){fs=false;first();if(!d.exists){fbPush('set');return}}if(!d.exists)return;const n=Object.assign({nama:'Mitra Multi Teknik',hr:'',wa:'',logo:''},d.data());if(JSON.stringify(n)==JSON.stringify(D.set))return;D.set=n;FC['set|main']=JSON.stringify(n);loc();rr()},fbErr)
 }catch(e){fbErr(e)}}
function fbPush(only){if(!FB)return;(only?[only]:[...COLS,'tim','set']).forEach(k=>{
 if(k=='set'){const j=JSON.stringify(D.set);if(FC['set|main']!=j){FC['set|main']=j;FB.doc('set/main').set(D.set).catch(fbErr)}return}
 if(k=='tim'){Object.keys(D.tim).forEach(d=>{const j=JSON.stringify(D.tim[d]);if(!D.tim[d].length){if(FC['tim|'+d]){delete FC['tim|'+d];FB.collection('tim').doc(d).delete().catch(fbErr)}return}if(FC['tim|'+d]!=j){FC['tim|'+d]=j;FB.collection('tim').doc(d).set({list:D.tim[d]}).catch(fbErr)}});
  Object.keys(FC).filter(x=>x.startsWith('tim|')).forEach(x=>{const d=x.slice(4);if(!D.tim[d]){delete FC[x];FB.collection('tim').doc(d).delete().catch(fbErr)}});return}
 D[k].forEach((e,i)=>{e.ord=i;const j=JSON.stringify(e);if(FC[k+'|'+e.id]!=j){FC[k+'|'+e.id]=j;FB.collection(k).doc(e.id).set(e).catch(fbErr)}});
 Object.keys(FC).filter(x=>x.startsWith(k+'|')).forEach(x=>{const id=x.slice(k.length+1);if(!D[k].some(e=>e.id==id)){delete FC[x];FB.collection(k).doc(id).delete().catch(fbErr)}})})}
setFav();/* ---------- Login ---------- */
const AUTH={u:'Admin123',p:'1234'};
const authed=()=>{try{return sessionStorage.getItem('mmt_auth')=='1'||localStorage.getItem('mmt_auth')=='1'}catch(e){return false}};
function logout(){try{sessionStorage.removeItem('mmt_auth');localStorage.removeItem('mmt_auth')}catch(e){}location.reload()}
function doLogin(){const u=$('#lu').value.trim(),p=$('#lp').value;if(u==AUTH.u&&p==AUTH.p){try{(($('#lk').checked?localStorage:sessionStorage)).setItem('mmt_auth','1')}catch(e){}$('#lgn').remove();start()}else{$('#le').textContent='Username atau password salah.';$('#lp').value='';$('#lp').focus()}}
function showLogin(){const s=D.set,d=document.createElement('div');d.id='lgn';d.className='lgn';
 d.innerHTML=`<div class="box">${s.logo?`<img class="logo" src="${s.logo}" alt="">`:`<div class="logo">${esc(s.nama[0]||'M')}</div>`}<h1>${esc(s.nama)}</h1><div style="color:var(--mut)">Monitoring Operasional Tim OP. Silakan masuk.</div>
 <label for="lu">Username</label><input id="lu" autocomplete="username" autocapitalize="none"><label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password">
 <label class="ck"><input id="lk" type="checkbox">Tetap masuk di perangkat ini</label><div class="err" id="le" role="alert"></div><button id="lb" style="width:100%;margin-top:6px">Masuk</button></div>`;
 document.body.appendChild(d);$('#lb').onclick=doLogin;d.addEventListener('keydown',e=>{if(e.key=='Enter')doLogin()});$('#lu').focus()}

if(authed())start();else showLogin();
